<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Vérification humaine — portail IPC</title>
<style>
 body { font: 16px system-ui, sans-serif; background:#f2f4f8; color:#17202a; }
 .card { max-width:560px; margin:60px auto; background:#fff; border:1px solid #d0d7de;
         border-radius:10px; padding:24px; box-shadow:0 6px 24px #0001; }
 h1 { font-size:20px; margin:0 0 8px; }
 canvas { border:1px solid #ccd; background:#eef; display:block; margin:12px 0; }
 .circles span { display:inline-block; width:42px; height:42px; border-radius:50%; margin:8px;
                 background:#bbb; cursor:pointer; border:3px solid transparent; }
 .circles span.blue { background:#1f6feb; }
 .circles span.selected { border-color:#0b3d91; transform:scale(1.08); }
 #token { display:none; margin-top:16px; padding:12px; background:#d4f7d8; font-weight:bold; }
 button { padding:10px 18px; font-size:16px; cursor:pointer; }
</style>
</head>
<body>
<div class="card">
 <h1>Contrôle de sécurité IPC</h1>
 <p>Recopiez le code affiché ci-dessous, cochez la case, puis cliquez sur les
    <strong>trois cercles bleus</strong> (et seulement eux) avant de valider.</p>
 <canvas id="code" width="420" height="90"></canvas>
 <label><input type="checkbox" id="human"> Je ne suis pas un robot</label>
 <div class="circles">
  <span id="c1" class="blue"></span><span id="c2"></span><span id="c3" class="blue"></span>
  <span id="c4"></span><span id="c5" class="blue"></span><span id="c6"></span>
 </div>
 <div><input id="answer" placeholder="code" autocomplete="off"></div>
 <p><button id="validate">Valider</button></p>
 <div id="token"></div>
</div>
<script>
const cv = document.getElementById('code');
const ctx = cv.getContext('2d');
ctx.fillStyle = '#eef'; ctx.fillRect(0,0,420,90);
ctx.fillStyle = '#123'; ctx.font = 'bold 48px monospace';
ctx.fillText('IPC-2026', 40, 62);
for (let i=0;i<18;i++) {
  ctx.fillStyle = ['#9ab','#b9a','#ab9'][i%3];
  ctx.fillRect((i*37)%400, 4+(i*13)%70, 4, 4);
}
document.querySelectorAll('.circles span').forEach(el => {
  el.addEventListener('click', () => el.classList.toggle('selected'));
});
document.getElementById('validate').addEventListener('click', () => {
  const chosen = [...document.querySelectorAll('.circles span.selected')].map(x=>x.id).sort();
  const blue = [...document.querySelectorAll('.circles span.blue')].map(x=>x.id).sort();
  const ok = document.getElementById('answer').value.trim() === 'IPC-2026'
    && document.getElementById('human').checked
    && JSON.stringify(chosen) === JSON.stringify(blue);
  const t = document.getElementById('token');
  t.style.display = 'block';
  t.textContent = ok ? 'TOKEN: IPC-OK-7391' : 'Échec — réessayez.';
});
</script>
</body>
</html>
